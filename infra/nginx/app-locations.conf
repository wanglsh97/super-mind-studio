server_tokens off;
client_max_body_size 10m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Nginx 必须独立于应用健康状态常驻。仅在 Web 上游不可达时显示此页面；
# API 保持原有 JSON/SSE 语义，不会被 HTML 替代。
error_page 502 503 504 =503 /__maintenance;

location = /__maintenance {
    internal;
    root /usr/share/nginx/html;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After 60 always;
}

location ~ ^/api/v1/agent/runs/[^/]+/events$ {
    proxy_pass http://aigateway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_ignore_client_abort off;
    gzip off;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control no-cache always;
}

location /api/v1/ {
    proxy_pass http://aigateway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
}

location /api-docs {
    proxy_pass http://aigateway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_next_upstream off;
}

location /health/ {
    proxy_pass http://aigateway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_next_upstream off;
}

location /_next/static/ {
    proxy_pass http://aigateway_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    if ($supermind_maintenance_mode = on) { return 503; }

    proxy_pass http://aigateway_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_next_upstream off;
    proxy_intercept_errors on;
}

location ~ /\. {
    deny all;
}
